apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-sim
  namespace: tmwaas-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-sim
  template:
    metadata:
      labels:
        app: core-sim
    spec:
      containers:
      - name: core-sim
        image: python:3.9-slim
        command: ["python3", "-m", "http.server", "8080"]
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20    
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: core-sim
  namespace: tmwaas-dev
spec:
  selector:
    app: core-sim
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080