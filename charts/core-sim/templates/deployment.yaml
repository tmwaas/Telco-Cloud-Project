apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-sim
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: core-sim

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: core-sim
    spec:
      restartPolicy: Always

      {{- with .Values.podSecurityContext }}
      securityContext:
{{ toYaml . | nindent 8 }}
      {{- end }}

      containers:
      - name: core-sim
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        ports:
        - containerPort: 8000
          name: http

        readinessProbe:
          httpGet:
            path: /health        # FIXED
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health        # FIXED
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10

        resources:
{{ toYaml .Values.resources | nindent 10 }}

        {{- with .Values.securityContext }}
        securityContext:
{{ toYaml . | nindent 10 }}
        {{- end }}