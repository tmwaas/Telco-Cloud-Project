image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 5

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  port: 80

env:
  ENVIRONMENT: "load-test"
  LOG_LEVEL: "info"

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10


