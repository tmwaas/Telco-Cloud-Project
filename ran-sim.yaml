apiVersion: apps/v1
kind: Deployment
metadata:
  name: ran-sim
  namespace: tmwaas-dev
  labels:
    app: ran-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ran-sim
  template:
    metadata:
      labels:
        app: ran-sim
    spec:
      containers:
      - name: ran-sim
        image: tmwaas/ran-sim:dev
        ports:
        - containerPort: 8000
        env:
        - name: CORE_URL
          value: "http://core-sim:80" 
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ran-sim
  namespace: tmwaas-dev
spec:
  selector:
    app: ran-sim
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000